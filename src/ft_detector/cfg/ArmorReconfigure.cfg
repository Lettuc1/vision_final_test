#!/usr/bin/env python
# -*- coding: utf-8 -*-
"""Online tuning for the traditional armor detector.

The defaults in this file mirror config/armor_params.yaml.  The node also
pushes the values loaded from YAML into this server at start-up, so editing the
YAML and relaunching the node is enough to change both the static and the
dynamic defaults.
"""

PACKAGE = "ft_detector"

from dynamic_reconfigure.parameter_generator_catkin import (
    ParameterGenerator, int_t, double_t, bool_t)

gen = ParameterGenerator()

# ---------------------------------------------------------------------------
# HSV thresholds.  Red wraps around the OpenCV hue circle, hence two windows.
# ---------------------------------------------------------------------------
gen.add("red_h_min1", int_t, 0, "red hue window 1 lower", 0, 0, 180)
gen.add("red_h_max1", int_t, 0, "red hue window 1 upper", 20, 0, 180)
gen.add("red_h_min2", int_t, 0, "red hue window 2 lower", 160, 0, 180)
gen.add("red_h_max2", int_t, 0, "red hue window 2 upper", 180, 0, 180)
gen.add("red_s_min", int_t, 0, "red saturation lower", 100, 0, 255)
gen.add("red_s_max", int_t, 0, "red saturation upper", 255, 0, 255)
gen.add("red_v_min", int_t, 0, "red value lower", 130, 0, 255)
gen.add("red_v_max", int_t, 0, "red value upper", 255, 0, 255)

gen.add("blue_h_min", int_t, 0, "blue hue lower", 90, 0, 180)
gen.add("blue_h_max", int_t, 0, "blue hue upper", 140, 0, 180)
gen.add("blue_s_min", int_t, 0, "blue saturation lower", 100, 0, 255)
gen.add("blue_s_max", int_t, 0, "blue saturation upper", 255, 0, 255)
gen.add("blue_v_min", int_t, 0, "blue value lower", 130, 0, 255)
gen.add("blue_v_max", int_t, 0, "blue value upper", 255, 0, 255)

gen.add("white_s_max", int_t, 0,
        "over-exposed core: maximum saturation", 110, 0, 255)
gen.add("white_v_min", int_t, 0,
        "over-exposed core: minimum value", 215, 0, 255)

# ---------------------------------------------------------------------------
# Light-bar shape / quality
# ---------------------------------------------------------------------------
gen.add("min_contour_area", int_t, 0, "minimum light-bar contour area (px)",
        40, 1, 100000)
gen.add("min_bar_length", double_t, 0, "minimum light-bar length (px)",
        8.0, 1.0, 1000.0)
gen.add("min_bar_ratio", double_t, 0, "minimum length/width ratio",
        1.2, 1.0, 50.0)
gen.add("max_bar_ratio", double_t, 0, "maximum length/width ratio",
        12.0, 1.0, 100.0)
gen.add("max_bar_tilt", double_t, 0, "maximum bar tilt from vertical (deg)",
        40.0, 0.0, 90.0)
gen.add("min_bar_p90_v", int_t, 0,
        "minimum 90th percentile V of a real LED bar", 225, 0, 255)
gen.add("min_white_ratio", double_t, 0,
        "minimum over-exposed white-core ratio (red)", 0.02, 0.0, 1.0)
gen.add("min_sat_ratio", double_t, 0,
        "minimum saturated-pixel ratio (blue)", 0.30, 0.0, 1.0)

# ---------------------------------------------------------------------------
# Pairing
# ---------------------------------------------------------------------------
gen.add("max_pair_distance", int_t, 0, "maximum bar-centre distance (px)",
        1100, 1, 10000)
gen.add("max_pair_angle", double_t, 0,
        "maximum angle difference between paired bars (deg)",
        30.0, 0.0, 90.0)
gen.add("max_pair_tilt", double_t, 0,
        "maximum tilt of the pair centre line (deg)",
        12.0, 0.0, 90.0)
gen.add("max_pair_center_dy_ratio", double_t, 0,
        "maximum |dy| between the two bar centres / mean bar length",
        0.35, 0.0, 5.0)
gen.add("max_endpoint_diff_ratio", double_t, 0,
        "maximum top/bottom endpoint mismatch / mean bar length",
        0.20, 0.0, 1.0)
gen.add("max_length_ratio_diff", double_t, 0,
        "maximum relative length difference between paired bars",
        0.20, 0.0, 1.0)
gen.add("min_width_ratio", double_t, 0,
        "minimum width ratio between paired bars", 0.40, 0.0, 1.0)
gen.add("armor_width_tolerance", double_t, 0,
        "lower factor of gap/length ratio for big/small armour",
        0.65, 0.0, 1.0)
gen.add("armor_width_upper_tolerance", double_t, 0,
        "upper factor (added to 1.0) of gap/length ratio for small armour",
        0.30, 0.0, 1.0)
gen.add("armor_large_gap_lower_factor", double_t, 0,
        "lower factor of gap/length ratio for large armour",
        0.85, 0.0, 1.0)
gen.add("armor_large_gap_upper_factor", double_t, 0,
        "upper factor of gap/length ratio for large armour; keep tight",
        1.18, 0.0, 2.0)
gen.add("max_large_box_aspect", double_t, 0,
        "maximum projected width/height ratio for large armour",
        5.00, 0.0, 20.0)
gen.add("wide_large_aspect_min", double_t, 0,
        "above this aspect a large armour needs number evidence",
        4.55, 0.0, 20.0)
gen.add("min_number_score_wide_large", double_t, 0,
        "minimum number score for a wide large armour",
        0.08, 0.0, 1.0)
gen.add("number_score_weight", double_t, 0,
        "weight of the number score in pair ranking (geometry first)",
        0.1, 0.0, 5.0)
gen.add("ratio_score_weight", double_t, 0,
        "weight of the gap/length ratio accuracy in pair ranking",
        1.8, 0.0, 5.0)
gen.add("large_dominance_factor", double_t, 0,
        "suppress small plates within this many large widths", 0.8, 0.0, 10.0)
gen.add("max_large_side_tilt", double_t, 0,
        "maximum mean absolute side-edge tilt of a large box",
        4.0, 0.0, 45.0)
gen.add("max_large_top_tilt", double_t, 0,
        "maximum top-edge tilt of a large box",
        1.5, 0.0, 45.0)
gen.add("max_large_single_side_tilt", double_t, 0,
        "maximum tilt of either side edge of a large box",
        5.0, 0.0, 45.0)
gen.add("max_small_top_tilt", double_t, 0,
        "maximum top-edge tilt of a small box", 3.0, 0.0, 45.0)
gen.add("max_small_side_tilt", double_t, 0,
        "maximum mean side-edge tilt of a small box", 8.0, 0.0, 45.0)
gen.add("max_small_single_side_tilt", double_t, 0,
        "maximum tilt of either side edge of a small box", 10.0, 0.0, 45.0)
gen.add("large_memory_frames", int_t, 0,
        "frames a large plate keeps suppressing local small plates", 8, 0, 30)
gen.add("large_memory_min_number_score", double_t, 0,
        "only large plates with this number score enter memory (0=all)",
        0.0, 0.0, 1.0)
gen.add("large_memory_min_hits", int_t, 0,
        "a large plate must be seen this many times before suppressing", 4, 1, 10)
gen.add("temporal_confirm_frames", int_t, 0,
        "number of frames a detection must be seen before publishing (1=off)",
        3, 1, 20)
gen.add("temporal_max_misses", int_t, 0,
        "frames a track survives without a match", 8, 0, 30)
# ---------------------------------------------------------------------------
# Plate / number evidence
# ---------------------------------------------------------------------------
gen.add("max_inner_mean_v", double_t, 0,
        "maximum mean V in the region between the bars",
        170.0, 0.0, 255.0)
gen.add("max_inner_colored_ratio", double_t, 0,
        "maximum saturated-colour ratio between the bars",
        0.15, 0.0, 1.0)

# ---------------------------------------------------------------------------
# PnP sanity checks
# ---------------------------------------------------------------------------
gen.add("max_reproj_error", double_t, 0,
        "maximum PnP reprojection RMSE (px)", 20.0, 0.0, 200.0)
gen.add("min_depth", double_t, 0, "minimum accepted armour depth (m)",
        0.10, 0.0, 10.0)
gen.add("max_depth", double_t, 0, "maximum accepted armour depth (m)",
        50.0, 0.1, 200.0)

gen.add("publish_mask", bool_t, 0, "publish /ft/debug/mask", True)
gen.add("publish_tf", bool_t, 0, "broadcast camera -> armor_<id>", True)

exit(gen.generate(PACKAGE, "ft_detector", "ArmorReconfigure"))
